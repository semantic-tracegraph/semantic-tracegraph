[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-tracegraph"
version = "0.1.0"
description = "Evidence-grounded semantic accomplishment graphs for coding-agent traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tracegraph = "tracegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
